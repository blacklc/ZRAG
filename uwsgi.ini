[uwsgi]
module = zrag.wsgi:application
master = true
processes = 1
http-socket = 0.0.0.0:5965
harakiri = 300
harakiri-verbose = true
vacuum = true
die-on-term = true
lazy-apps = true

# === uWSGI 日志配置 ===
# 进程日志 (启动、worker 管理、错误) → uwsgi.log
logto = /app/logs/uwsgi.log
# 日志中包含时间戳 (格式: [YYYY-MM-DD HH:MM:SS])
log-date = [%%Y-%%m-%%d %%H:%%M:%%S]
# 委托 master 进程统一写日志 (避免多 worker 竞争)
log-master = true
# 日志轮转: 单文件最大 100MB, 保留最近 7 个备份
log-maxsize = 104857600
log-backupname = /app/logs/uwsgi.log.%d

# 请求日志 (每个 HTTP 请求的方法、路径、状态码、耗时) → uwsgi-req.log
req-logger = file:/app/logs/uwsgi-req.log
