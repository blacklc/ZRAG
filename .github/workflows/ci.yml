# ZRAG CI — 后端 pytest 与前端 vitest/build
#
# 两个 job 并行执行:
#   backend  — Python 3.10 (与 Dockerfile.backend 一致), 安装 requirements 后执行 pytest
#   frontend — Node 22 (与 Dockerfile.frontend 一致), npm ci 后执行 vitest 与构建
#
# 触发条件:
#   - push 到 main
#   - 任意 pull_request

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 仅需读取仓库内容, 遵循最小权限原则
permissions:
  contents: read

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本与 Dockerfile.backend 的基础镜像 python:3.10-slim 保持一致
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest 与 pytest-django 不在 requirements.txt 中, 因为它们不是运行时依赖,
          # 而是为了让克隆仓库的人能够执行测试而额外安装的开发工具。
          # pytest-django 会读取 pytest.ini 中的 DJANGO_SETTINGS_MODULE 并完成 Django 初始化。
          pip install pytest pytest-django

      # zrag/settings.py 的日志 handler 指向 logs/debug.log 等文件, 但 logs/ 被 .gitignore
      # 排除, CI 中检出后并不存在该目录, 因此需要预先创建, 否则 Django 初始化日志配置时会抛
      # FileNotFoundError: No such file or directory: '.../logs/debug.log'.
      - name: 创建日志目录
        run: mkdir -p logs

      - name: Run backend tests
        # tests/test_08_bge_embedder.py 会通过 sentence-transformers 实际加载
        # BAAI/bge-small-zh-v1.5 模型 (缓存目录默认位于宿主机的 ./models), CI 环境中不存在,
        # 且 zrag/embed/local.py 在导入时设置了 TRANSFORMERS_OFFLINE=1, 无法在线下载。
        # 其余测试均使用 mock embedder、:memory: 数据库或临时目录中的合成向量,
        # 因此这里排除该文件, 执行一个明确的、可在无模型环境下运行的安全子集。
        run: python -m pytest tests/ -v --ignore=tests/test_08_bge_embedder.py

  frontend:
    name: Frontend / vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本与 Dockerfile.frontend 的 node:22-alpine 保持一致
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # 注意: cache-dependency-path 相对于仓库根目录, 不受 defaults.run.working-directory 影响
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # package.json 中 "test" 脚本的实际命令为 "vitest run"
      - name: Run frontend tests
        run: npm run test

      # package.json 中 "build" 脚本的实际命令为 "vite build"
      - name: Build frontend
        run: npm run build
